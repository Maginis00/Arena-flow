# Prebuilds every dependency on Linux and publishes the target directory as
# the release assets `build-cache/arena-target-{debug,release}.tgz`.
#
# Claude cloud sessions download them in their environment setup script
# (.claude/cloud-setup.sh), so a new session only compiles flow_arena itself
# instead of all of Bevy (about 10 min for the tests plus 7 min for the
# release playtest build on the cloud VM's 4 cores). Cargo reuses the
# artifacts only when everything that goes into them matches, so this job
# mirrors the cloud VM: Ubuntu 24.04, root with CARGO_HOME=/root/.cargo,
# Rust 1.95 and the same CARGO_TARGET_DIR. Any mismatch just means cargo
# rebuilds; it never produces a wrong binary.
name: build-cache

on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - .cargo/**
      - .github/workflows/build-cache.yml
  # Build only (no publish) on PRs that touch the same files, to check them.
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - .cargo/**
      - .github/workflows/build-cache.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    env:
      CARGO_HOME: /root/.cargo
      RUSTUP_HOME: /root/.rustup
      CARGO_TARGET_DIR: /opt/arena-target
      CARGO_TERM_COLOR: never
    steps:
      - name: System packages
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            curl ca-certificates git build-essential pkg-config gh \
            libx11-dev libwayland-dev libxkbcommon-dev libudev-dev

      - uses: actions/checkout@v4

      - name: Rust 1.95
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal \
            --default-toolchain 1.95 -c clippy -c rustfmt
          echo "/root/.cargo/bin" >> "$GITHUB_PATH"

      # What Claude runs before pushing (CLAUDE.md), so both the test build and
      # clippy's check build start warm. Lints don't fail the cache.
      - name: Build dependencies
        run: |
          cargo test --no-run
          cargo clippy --all-targets
          cargo build --release --example playtest

      - name: Pack
        run: |
          # Our own crate is rebuilt in every session anyway; incremental data
          # only helps on the machine that wrote it.
          cargo clean -p flow_arena
          rm -rf /opt/arena-target/debug/incremental
          # Two assets, because GitHub caps each one at 2 GB.
          tar -C /opt -czf arena-target-debug.tgz arena-target/debug
          tar -C /opt -czf arena-target-release.tgz arena-target/release
          ls -lh arena-target-*.tgz

      - name: Publish
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view build-cache >/dev/null 2>&1 || \
            gh release create build-cache --prerelease --title "Build cache" \
              --notes "Prebuilt Linux dependencies for Claude cloud sessions. Updated automatically by the build-cache workflow; not a game release."
          gh release upload build-cache arena-target-debug.tgz arena-target-release.tgz --clobber
