[package]
name = "flow_arena"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
# Pinned exactly. 2D + UI (debug text) only: no 3D, no audio.
bevy = { version = "=0.19.1", default-features = false, features = ["2d", "ui"] }
thiserror = "2"
# Session files for the playtest report (telemetry/record_file.rs).
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The work area (screen minus taskbar) for tiling watched bots
# (playtest/work_area.rs). Same version and a subset of the features winit
# already builds, so it adds nothing to compile.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

# Keep our code fast to compile but make dependencies fast at runtime.
[profile.dev]
opt-level = 1
# Full debug info for Bevy makes linking the biggest memory spike; line tables
# still give file:line in backtraces.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3

# Stated explicitly so nobody turns on LTO casually: it multiplies link memory.
[profile.release]
lto = false
